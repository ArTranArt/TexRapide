[package]
name = "texrapide"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs_extra = "1.3.0"
notify = "8.2.0"
window-vibrancy = "0.7.1"

# Force les versions stables pour tout l'arbre de dépendances
[patch.crates-io]
time = { git = "https://github.com/time-rs/time", tag = "v0.3.36" }
hashbrown = { git = "https://github.com/rust-lang/hashbrown", tag = "v0.15.0" }
